<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Telephone Number Validator</title>
    <link rel="stylesheet" href="TNV.css" />
  </head>
  <body>
    <div class="container">
      <h1>US Phone Number Validator</h1>
      <input type="text" id="user-input" placeholder="Enter US phone number" />
      <div class="buttons">
        <button id="check-btn">Check</button>
        <button id="clear-btn">Clear</button>
      </div>
      <div id="results-div"></div>
    </div>

    <script src="TNV.js"></script>
  </body>
</html>
